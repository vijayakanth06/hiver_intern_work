# ==============================================================================
# Global Base Configuration — Hiver AI Support Agent
# ==============================================================================

pipeline:
  seed: 42
  num_workers: 32
  device: "cuda"
  fp16: true
  bf16: true

llm:
  provider_order: ["ollama", "groq", "openrouter"]
  ollama_model: "gpt-oss:20b"
  ollama_base_url: "http://localhost:11434/v1"
  temperature: 0.0
  max_tokens: 512
  timeout: 30
  max_retries: 3
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_seconds: 60

embeddings:
  base_model: "BAAI/bge-small-en-v1.5"
  quality_model: "BAAI/bge-m3"
  dimension: 384
  max_seq_length: 512
  normalize_embeddings: true
  batch_size: 64

retrieval:
  top_k: 3
  candidate_pool_size: 15
  hybrid:
    enabled: true
    bm25_weight: 0.4
    dense_weight: 0.6
    rrf_k: 60
  reranker:
    enabled: true
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    min_score_threshold: -5.0
  mmr:
    enabled: true
    lambda_param: 0.7

classification:
  track_a:
    model: "llama-3.1-8b-instant"
    dynamic_knn_k: 3
  track_b:
    model_name: "microsoft/deberta-v3-small"
    lora:
      r: 8
      lora_alpha: 16
      lora_dropout: 0.1
      target_modules: ["query_proj", "value_proj", "dense"]
    focal_loss:
      gamma: 2.0
    training:
      epochs: 5
      learning_rate: 3.0e-5
      weight_decay: 0.01
      warmup_ratio: 0.1
      batch_size: 32
  calibration:
    temperature_scaling: true
    threshold_tuning: true

escalation:
  cost_matrix:
    false_auto_handle: 10.00
    false_escalation: 1.50
    true_auto_handle: 0.10
    true_escalation: 1.50
  conformal:
    enabled: true
    error_budget: 0.05  # 95% confidence bound
  thresholds:
    confidence_min: 0.70
    entropy_max: 0.85
    sentiment_negative_max: -0.40
    max_customer_turns: 3
    rag_similarity_min: 0.65

semantic_cache:
  enabled: true
  similarity_threshold: 0.97
  max_cache_entries: 50000

eval:
  golden_sample_size: 200
  judge_model: "openai/gpt-4o-mini"
  deepeval:
    enabled: true
    threshold: 0.70
